<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myapp · Notes</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    #version { color: #666; font-size: 13px; margin-bottom: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 8px 12px; font-size: 14px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <div id="version"></div>
  <form id="add">
    <input id="text" placeholder="Write a note" required>
    <button class="primary">Add</button>
  </form>
  <ul id="notes"></ul>

  <script>
    const list = document.getElementById("notes");

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error(`${method} ${url} failed: ${res.status}`);
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      try {
        const notes = await api("GET", "/api/notes");
        list.innerHTML = "";
        for (const note of notes) {
          const li = document.createElement("li");
          const span = document.createElement("span");
          span.textContent = `#${note.id} ${note.text}`;
          const edit = document.createElement("button");
          edit.textContent = "Edit";
          edit.onclick = async () => {
            const text = prompt("Edit note", note.text);
            if (text) { await api("PUT", `/api/notes/${note.id}`, { text }); load(); }
          };
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = async () => { await api("DELETE", `/api/notes/${note.id}`); load(); };
          li.append(span, edit, del);
          list.append(li);
        }
      } catch (err) {
        list.innerHTML = `<li class="error">${err.message}</li>`;
      }
    }

    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("text");
      await api("POST", "/api/notes", { text: input.value });
      input.value = "";
      load();
    };

    api("GET", "/health").then((h) => {
      document.getElementById("version").textContent = `version ${h.version}`;
    });
    load();
  </script>
</body>
</html>
